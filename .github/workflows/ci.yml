name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3.3"]
    # The official image pins the exact patch release. swift-actions/setup-swift
    # only accepts a minor version, and "6.2" was resolving to 6.2.1.
    container: swift:${{ matrix.swift }}

    steps:
      - uses: actions/checkout@v4


      # --enable-all-traits: a root build compiles every target, but only
      # traits that are enabled bring their dependencies. Without this the
      # Security target would be built with JWTKit pruned and fail.
      - name: Build (Flight's own warnings are errors)
        env:
          FLIGHT_STRICT_WARNINGS: "1"
        run: swift build --enable-all-traits

      - name: Test
        run: ./CI/run-tests.sh

      # A root build compiles every target regardless of traits, so it cannot
      # verify the lean configuration. This builds an actual consumer and
      # fails if any gated dependency leaked into its resolution.
      - name: Lean consumer resolves no gated dependency
        run: ./CI/check-lean-consumer.sh

      # The generator tests assert on emitted text and exit codes, so a
      # generated file can satisfy all of them and still not compile. This
      # builds a consumer whose component reads configuration — the shape
      # whose graph initializer throws, and the one that shipped broken.
      - name: Generated file compiles
        run: ./CI/check-generated-compiles.sh

  # flight-data is this framework's largest consumer and nothing built it: a
  # source-breaking change shipped in 0.19.0 (a third associated value on
  # `ConfigError.missingKey`, which pattern matching does not default) and
  # both sides stayed green — flight because it does not build flight-data,
  # flight-data because its CI resolves the published tag. Same class as the
  # templates job below, one repository over.
  data:
    name: flight-data builds against this commit
    uses: Flight-Framework/flight-data/.github/workflows/ci.yml@main
    with:
      flight_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  lint:
    # Advisory only. Seven of the eight merged packages predate the shared
    # .swift-format config, leaving 1,725 violations as measured on
    # 2026-09-18; the macro fixture suites in particular hold
    # expected-expansion string literals that a bulk reformat would corrupt.
    # This job reports drift without blocking merges until that reformat
    # lands as its own reviewed change.
    #
    # The number is here to be useful, so it has to be real: this comment
    # said ~1240 and GAPS.md said 1,309, neither matching the tool or each
    # other. Re-measure when you touch it — `swift format lint --recursive
    # --strict Sources Tests` — rather than carrying the figure forward.
    name: Format (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4


      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # Every module with a .docc catalogue, each with --warnings-as-errors:
      # an unresolved symbol link, a doc comment naming a renamed parameter,
      # or a Topics entry pointing at a symbol that no longer exists all fail
      # the job. Documentation that nothing checks rots into documentation
      # that is wrong, which is worse than none.
      - name: Generate documentation
        env:
          FLIGHT_BUILD_DOCS: "1"
        run: |
          # The plugin *moves* its archive to --output-path, so the parent
          # has to exist first.
          mkdir -p ./docs
          for target in FlightCore FlightConfig FlightConfigCore FlightWeb \
                        FlightChannels FlightChannelsProtocol \
                        FlightChannelsClient FlightChannelsTesting \
                        FlightPubSub FlightPubSubTesting FlightPresence \
                        FlightPresenceProtocol FlightPresenceClient \
                        FlightActuator FlightSecurityCore FlightWebTesting \
                        FlightTransport FlightScheduler; do
            echo "::group::$target"
            swift package --enable-all-traits \
              --allow-writing-to-directory "./docs/$target" \
              generate-documentation --target "$target" \
              --include-extended-types \
              --warnings-as-errors --output-path "./docs/$target"
            echo "::endgroup::"
          done

  macos:
    name: Build on macOS
    runs-on: macos-15
    # Advisory, and there were two blockers stacked behind this flag, not one.
    #
    # The first was ours: `Duration.nanoseconds(Double)` in FlightConfigCore,
    # macOS 26+, fixed in d35b350. It failed *first* because FlightConfigCore
    # is the dependency-free half of Config and compiles before
    # swift-configuration is reached — so the log showed only our error, and a
    # commit message here briefly claimed the upstream one was imaginary. It
    # is not; fixing ours simply uncovered it.
    #
    # The second is upstream and stands:
    #
    #   .build/checkouts/swift-configuration/Sources/Configuration/Providers/
    #     Files/FileProvider.swift:189: value of type 'Data' has no member 'bytes'
    #
    # That file imports FoundationEssentials where it can and Foundation
    # otherwise. On Linux it gets the former, whose `Data` has `.bytes`; on a
    # Darwin SDK older than macOS 26 it gets the latter, which does not. So
    # this is an SDK-and-deployment-target question rather than a bug we can
    # patch, and raising `platforms:` is the lever — at the cost of dropping
    # every macOS below 26.
    #
    # Drop this flag once the job is green: the `platforms: [.macOS(.v15)]`
    # claim in Package.swift is either true or it is not, and a permanently
    # red advisory check just teaches people to ignore CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # swiftly rather than swift-actions/setup-swift: this package declares
      # swift-tools-version 6.3, and setup-swift only indexes up to 6.2.
      # swiftly is also what the toolchain is managed with locally, so CI and
      # a developer's machine resolve the same way.
      - name: Install Swift
        run: |
          curl -fsSL -o swiftly.pkg https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install 6.3.3 --use --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: swift --version

      - name: Build
        run: swift build --enable-all-traits

  # The starter templates are built against *this* commit, in flight-cli's own
  # workflow. Its `workflow_call` trigger exists for this, and until now
  # nothing called it: five renamed or removed APIs reached the templates
  # unnoticed, and `flight new` emitted a project that did not compile against
  # the versions it resolved. A breaking change here should fail on the pull
  # request that causes it, not in a new user's first ten minutes.
  templates:
    name: Starter templates
    uses: Flight-Framework/flight-cli/.github/workflows/ci.yml@main
    with:
      flight_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
