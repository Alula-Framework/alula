name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3.3"]
    # The official image pins the exact patch release. swift-actions/setup-swift
    # only accepts a minor version, and "6.2" was resolving to 6.2.1.
    container: swift:${{ matrix.swift }}
    # A real SMTP server that insists on STARTTLS, so the SMTP transport's
    # integration test runs here instead of skipping: the fake server in the
    # unit suite cannot say whether a real MIME parser reads our messages.
    services:
      mailpit:
        image: axllent/mailpit
        env:
          MP_SMTP_TLS_CERT: sans:mailpit
          MP_SMTP_TLS_KEY: sans:mailpit
          MP_SMTP_REQUIRE_STARTTLS: "true"

    steps:
      - uses: actions/checkout@v4


      # --enable-all-traits: a root build compiles every target, but only
      # traits that are enabled bring their dependencies. Without this the
      # Security target would be built with JWTKit pruned and fail.
      - name: Build (Alula's own warnings are errors)
        env:
          ALULA_STRICT_WARNINGS: "1"
        run: swift build --enable-all-traits

      - name: Test
        env:
          ALULA_SMTP_TEST_HOST: mailpit
          ALULA_SMTP_TEST_PORT: "1025"
        run: ./CI/run-tests.sh

      # A root build compiles every target regardless of traits, so it cannot
      # verify the lean configuration. This builds an actual consumer and
      # fails if any gated dependency leaked into its resolution.
      - name: Lean consumer resolves no gated dependency
        run: ./CI/check-lean-consumer.sh

      # The lean check takes Alula by path, which SwiftPM exempts from the
      # rule that a version-resolved package may not depend on a revision- or
      # branch-pinned one. 0.28.0 and 0.29.0 broke exactly that way for every
      # consumer enabling Security, with this whole job green (D37). This one
      # tags a copy of the tree and resolves it by version, every trait on.
      - name: Versioned consumer resolves with every trait
        run: ./CI/check-versioned-consumer.sh

      # The generator tests assert on emitted text and exit codes, so a
      # generated file can satisfy all of them and still not compile. This
      # builds a consumer whose component reads configuration — the shape
      # whose graph initializer throws, and the one that shipped broken.
      - name: Generated file compiles
        run: ./CI/check-generated-compiles.sh


  # OIDC sign-in against a real Keycloak. The unit suite proves the protocol
  # against fakes; this proves the seam holds against what it exists to plug
  # into. Its own job because the test job runs inside a Swift container,
  # which has no Docker to start Keycloak with: Keycloak runs on the runner,
  # and the suite runs in a Swift container sharing the runner's network.
  keycloak:
    name: OIDC sign-in against Keycloak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Keycloak with the alula-test realm
        run: ./CI/keycloak/start.sh
      - name: Sign-in suites against it
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e ALULA_TEST_KEYCLOAK_URL=http://localhost:8089 \
            swift:6.3.3 \
            swift test --enable-all-traits --scratch-path /tmp/build \
              --filter "KeycloakSignIn|OIDCSignIn|SignInContract"

  # alula-data is this framework's largest consumer and nothing built it: a
  # source-breaking change shipped in 0.19.0 (a third associated value on
  # `ConfigError.missingKey`, which pattern matching does not default) and
  # both sides stayed green — alula because it does not build alula-data,
  # alula-data because its CI resolves the published tag. Same class as the
  # templates job below, one repository over.
  data:
    name: alula-data builds against this commit
    uses: Alula-Framework/alula-data/.github/workflows/ci.yml@main
    with:
      alula_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  lint:
    # Advisory only. Seven of the eight merged packages predate the shared
    # .swift-format config, leaving 1,725 violations as measured on
    # 2026-09-18; the macro fixture suites in particular hold
    # expected-expansion string literals that a bulk reformat would corrupt.
    # This job reports drift without blocking merges until that reformat
    # lands as its own reviewed change.
    #
    # The number is here to be useful, so it has to be real: this comment
    # said ~1240 and GAPS.md said 1,309, neither matching the tool or each
    # other. Re-measure when you touch it — `swift format lint --recursive
    # --strict Sources Tests` — rather than carrying the figure forward.
    name: Format (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4


      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # Every module with a .docc catalogue, each with --warnings-as-errors:
      # an unresolved symbol link, a doc comment naming a renamed parameter,
      # or a Topics entry pointing at a symbol that no longer exists all fail
      # the job. Documentation that nothing checks rots into documentation
      # that is wrong, which is worse than none.
      - name: Generate documentation
        env:
          ALULA_BUILD_DOCS: "1"
        run: |
          # The plugin *moves* its archive to --output-path, so the parent
          # has to exist first.
          mkdir -p ./docs
          for target in AlulaCore AlulaConfig AlulaConfigCore AlulaWeb \
                        AlulaChannels AlulaChannelsProtocol \
                        AlulaChannelsClient AlulaChannelsTesting \
                        AlulaPubSub AlulaPubSubTesting AlulaPresence \
                        AlulaPresenceProtocol AlulaPresenceClient \
                        AlulaActuator AlulaSecurityCore AlulaWebTesting \
                        AlulaTransport AlulaScheduler \
                        AlulaSessions AlulaSessionsTesting \
                        AlulaAPNS AlulaAPNSTesting \
                        AlulaRateLimit AlulaRateLimitTesting \
                        AlulaTelemetryBridges \
                        AlulaQueue AlulaQueueTesting \
                        AlulaMail AlulaMailTesting AlulaMailSMTP; do
            echo "::group::$target"
            swift package --enable-all-traits \
              --allow-writing-to-directory "./docs/$target" \
              generate-documentation --target "$target" \
              --include-extended-types \
              --warnings-as-errors --output-path "./docs/$target"
            echo "::endgroup::"
          done

  macos:
    name: Build on macOS
    runs-on: macos-26
    # Required, and green. Two blockers were stacked here, and neither was the
    # one this job spent four releases blaming.
    #
    # The first was ours: `Duration.nanoseconds(Double)` in AlulaConfigCore is
    # macOS 26+, fixed in d35b350. It failed first because AlulaConfigCore is
    # the dependency-free half of Config and compiles before
    # swift-configuration is reached, so its error was the only one in the log.
    #
    # The second was swift-configuration's `FileProvider.swift`, which takes
    # FoundationEssentials where it can and Foundation otherwise — and on the
    # macos-15 image got the latter, whose `Data` has no `.bytes`. That is an
    # SDK question, not a deployment-target one: on macos-26 it builds with
    # `platforms: [.macOS(.v15)]` untouched. Measured both ways rather than
    # assumed — .v26 + macos-26 passed, and so did .v15 + macos-26, which is
    # the one that costs nobody a platform.
    steps:
      - uses: actions/checkout@v4

      # swiftly rather than swift-actions/setup-swift: this package declares
      # swift-tools-version 6.3, and setup-swift only indexes up to 6.2.
      # swiftly is also what the toolchain is managed with locally, so CI and
      # a developer's machine resolve the same way.
      - name: Install Swift
        run: |
          curl -fsSL -o swiftly.pkg https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install 6.3.3 --use --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain
        run: swift --version

      - name: Build
        run: swift build --enable-all-traits

  # The starter templates are built against *this* commit, in alula-cli's own
  # workflow. Its `workflow_call` trigger exists for this, and until now
  # nothing called it: five renamed or removed APIs reached the templates
  # unnoticed, and `alula new` emitted a project that did not compile against
  # the versions it resolved. A breaking change here should fail on the pull
  # request that causes it, not in a new user's first ten minutes.
  templates:
    name: Starter templates
    uses: Alula-Framework/alula-cli/.github/workflows/ci.yml@main
    with:
      caller: alula
      alula_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
